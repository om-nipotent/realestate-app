services:
  - type: web
    name: realestate-backend
    env: node
    region: singapore
    rootDir: backend
    buildCommand: "npm install"
    startCommand: "npm start"
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: NODE_VERSION
        value: "18.18.0"
      - key: PORT
        value: "10000"

      # MongoDB Atlas
      - key: MONGO_URI
        sync: false

      # Auth
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: "7d"

      # CORS — Vercel frontend URL
      - key: CLIENT_URL
        value: "https://realestate-frontend-mauve.vercel.app"

      # Cloudinary (optional — set later)
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # Email (optional — set later)
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
